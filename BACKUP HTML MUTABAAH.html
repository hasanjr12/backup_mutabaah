let mediaRecorder;
let audioChunks = [];
let audioBase64 = null;
let recordInterval;
let recordSeconds = 0;

window.startRecording = async function() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
            if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            
            const previewEl = document.getElementById('audio-preview');
            previewEl.src = audioUrl;
            previewEl.classList.remove('hidden');
            document.getElementById('btn-hapus-rekaman').classList.remove('hidden');

            // Konversi ke Base64 untuk dikirim ke Google Apps Script
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = function() {
                audioBase64 = reader.result;
            }
        };

        mediaRecorder.start();
        document.getElementById('btn-start-record').classList.add('hidden');
        document.getElementById('btn-stop-record').classList.remove('hidden');
        document.getElementById('recording-indicator').classList.remove('hidden');

        recordSeconds = 0;
        document.getElementById('record-time').innerText = "00:00";
        recordInterval = setInterval(() => {
            recordSeconds++;
            const m = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
            const s = String(recordSeconds % 60).padStart(2, '0');
            document.getElementById('record-time').innerText = `${m}:${s}`;
        }, 1000);

    } catch (err) {
        Swal.fire('Akses Ditolak', 'Harap izinkan akses mikrofon di browser Anda.', 'error');
    }
};

window.stopRecording = function() {
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        clearInterval(recordInterval);
        
        const btnStart = document.getElementById('btn-start-record');
        btnStart.classList.remove('hidden');
        btnStart.innerHTML = '<i class="fas fa-redo"></i> Rekam Ulang';
        
        document.getElementById('btn-stop-record').classList.add('hidden');
        document.getElementById('recording-indicator').classList.add('hidden');
    }
};

window.hapusRekaman = function() {
    audioChunks = [];

// Fungsi pembersih format persentase (mengatasi data desimal 0.98 dari Google Sheets menjadi 98%)
window.formatNilaiTargetClean = function(valTarget) {
  if (!valTarget || valTarget === '-') return '-';
  let str = String(valTarget).trim();
  let cleanNumStr = str.replace('%', '').replace(',', '.');
  let num = parseFloat(cleanNumStr);
  if (isNaN(num)) return str;
  // Jika tersimpan sebagai desimal pecahan (misal 0.98 atau 0.5)
  if (num > 0 && num <= 1) {
    num = num * 100;
  }
  let rounded = Math.round(num * 10) / 10;
  return rounded + '%';
};

window.formatAyatClean = function(ayatVal) {
  if (!ayatVal) return '-';
  let str = String(ayatVal).trim();
  if (str.includes('T') && str.includes('Z') && (str.includes(':') || str.length > 15)) {
    return '1-12';
  }
  return str;
};

window.playSuccessSound = function() {
  try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1046.50, ctx.currentTime + 0.1);
      
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
  } catch (e) { console.log("Audio API not supported"); }
};

window.copyCredential = function(text) {
    navigator.clipboard.writeText(text).then(() => {
        Swal.fire({
            title: 'Berhasil disalin!',
            text: text,
            icon: 'success',
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 1500
        });
    }).catch(err => {
        let tempInput = document.createElement("input");
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);
        Swal.fire({
            title: 'Berhasil disalin!',
            text: text,
            icon: 'success',
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 1500
        });
    });
};

window.initOrtuChart = function() {
  const ctx = document.getElementById('ortuChart');
  if (!ctx) return;
  if (window.ortuChartInstance) window.ortuChartInstance.destroy();
  const monthNames = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
  let labels = []; let dataPoints = [];
  for (let i = 5; i >= 0; i--) {
      let d = new Date(); d.setMonth(d.getMonth() - i); labels.push(monthNames[d.getMonth()]);
      let count = (state.setoran || []).filter(s => { let sd = new Date(s.tanggal); return sd.getMonth() === d.getMonth() && sd.getFullYear() === d.getFullYear(); }).length;
      dataPoints.push(count);
  }
  
  const gridColor = state.isDarkMode ? '#1a3c3c' : '#f3f4f6';

  window.ortuChartInstance = new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: [{ label: 'Aktivitas Hafalan', data: dataPoints, borderColor: '#044343', backgroundColor: 'rgba(4, 67, 67, 0.1)', borderWidth: 2.5, pointBackgroundColor: '#D4AF37', pointBorderColor: '#fff', pointBorderWidth: 2, pointRadius: 4, fill: true, tension: 0.4 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 10 } }, grid: { color: gridColor, drawBorder: false } }, x: { grid: { display: false }, ticks: { font: { size: 10 } } } } }
  });
};

window.updateAdminChart = function(filterVal = 'ALL') {

    targetSantri.forEach(s => {
        let nama = s.nama_santri || s.nama || s.NAMA_SANTRI || 'Tanpa Nama';
        let valStr = String(s.nilai_target || s.NILAI_TARGET || s.Nilai_Target || s['Nilai Target'] || s.target || '0').replace('%', '').replace(',', '.');
        let val = parseFloat(valStr);
        if (val > 0 && val <= 1) val = val * 100;
        
        if (isNaN(val) || val === 0) {
            kategoriMurid.belum.push(nama);
        } else if (val >= 100) {
            kategoriMurid.selesai.push(nama);
        } else if (val >= 90 && val < 100) {
            kategoriMurid.proses.push(nama);
        } else {
            kategoriMurid.dibawah90.push(nama);
        }
    });

    const labelColor = state.isDarkMode ? '#f1f5f9' : '#374151';

    window.adminChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Target Selesai (100)', '90-99', 'Di bawah 90', 'Belum Diset'],
            datasets: [{
                data: [kategoriMurid.selesai.length, kategoriMurid.proses.length, kategoriMurid.dibawah90.length, kategoriMurid.belum.length],
                backgroundColor: ['#10B981', '#F59E0B', '#EF4444', '#9CA3AF'], 
                borderWidth: 2,
                borderColor: state.isDarkMode ? '#0a1919' : '#ffffff',
                hoverOffset: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '70%',
            plugins: {
                legend: {
                    position: 'right',
                    labels: { font: { size: 10, family: "'Poppins', sans-serif" }, color: labelColor, usePointStyle: true, padding: 15 }
                },
                tooltip: {
                    callbacks: {
                        title: function(context) {
                            return context[0].label;
                        },
                        label: function(context) {
                            const index = context.dataIndex;
                            let listNama = [];
                            if (index === 0) listNama = kategoriMurid.selesai;
                            else if (index === 1) listNama = kategoriMurid.proses;
                            else if (index === 2) listNama = kategoriMurid.dibawah90;
                            else if (index === 3) listNama = kategoriMurid.belum;

                            return `Jumlah: ${listNama.length} Murid`;
                        },
                        footer: function(tooltipItems) {
                            const index = tooltipItems[0].dataIndex;
                            let listNama = [];
                            if (index === 0) listNama = kategoriMurid.selesai;
                            else if (index === 1) listNama = kategoriMurid.proses;
                            else if (index === 2) listNama = kategoriMurid.dibawah90;
                            else if (index === 3) listNama = kategoriMurid.belum;

                            if (listNama.length === 0) return ['(Tidak ada murid)'];
                            
                            // Mengembalikan array agar Chart.js merender setiap nama murid ke baris baru ke bawah
                            let lines = ['---'];
                            listNama.forEach((nama, idx) => {
                                lines.push(`${idx + 1}. ${nama}`);
                            });
                            return lines;
                        }
                    }
                }
            }
        }
    });
};

window.renderApp = function() {
  const root = document.getElementById('app-root');
  const wrapper = document.getElementById('blogger-app-override');
  
  if (!state.user) { 
    if(wrapper) wrapper.classList.remove('admin-landscape');
    root.innerHTML = window.renderLogin();

    if (isSuperAdmin && wrapper) {
        wrapper.classList.add('admin-landscape');

        wrapper.classList.remove('admin-landscape');
    }

    if (roleUser === 'ustadz' || roleUser === 'admin') { 
      root.innerHTML = window.renderUstadzDashboard(); 
      if(state.activeTab === 'input-setoran' || state.activeTab === 'rapor-biru') window.populateSantriSelect(); 
      if(state.activeTab === 'beranda') setTimeout(() => window.updateAdminChart('ALL'), 150);

      root.innerHTML = window.renderOrtuDashboard(); 
      if(state.activeTabOrtu === 'beranda') setTimeout(() => window.initOrtuChart(), 100);

let talqinMediaRecorder;
let talqinAudioChunks = [];
let talqinAudioBase64 = null;
let talqinInterval;
let talqinSeconds = 0;

window.startTalqinUstadz = async function(idOnline) {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        talqinMediaRecorder = new MediaRecorder(stream);
        talqinAudioChunks = [];

        talqinMediaRecorder.ondataavailable = event => {
            if (event.data.size > 0) talqinAudioChunks.push(event.data);
        };

        talqinMediaRecorder.onstop = () => {
            const blob = new Blob(talqinAudioChunks, { type: 'audio/webm' });
            const url = URL.createObjectURL(blob);
            
            const preview = document.getElementById('audio-preview-talqin-' + idOnline);
            preview.src = url;
            preview.classList.remove('hidden');
            document.getElementById('btn-hapus-talqin-' + idOnline).classList.remove('hidden');

            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = function() {
                talqinAudioBase64 = reader.result;
            }
        };

        talqinMediaRecorder.start();
        document.getElementById('btn-start-talqin-' + idOnline).classList.add('hidden');
        document.getElementById('btn-stop-talqin-' + idOnline).classList.remove('hidden');
        document.getElementById('indicator-talqin-' + idOnline).classList.remove('hidden');

        talqinSeconds = 0;
        document.getElementById('time-talqin-' + idOnline).innerText = "00:00";
        talqinInterval = setInterval(() => {
            talqinSeconds++;
            let m = String(Math.floor(talqinSeconds / 60)).padStart(2, '0');
            let s = String(talqinSeconds % 60).padStart(2, '0');
            let timeEl = document.getElementById('time-talqin-' + idOnline);
            if(timeEl) timeEl.innerText = `${m}:${s}`;
        }, 1000);

    } catch (err) {
        Swal.fire('Akses Ditolak', 'Mohon izinkan mikrofon di browser Anda.', 'error');
    }
};

window.stopTalqinUstadz = function(idOnline) {
    if (talqinMediaRecorder && talqinMediaRecorder.state === "recording") {
        talqinMediaRecorder.stop();
        talqinMediaRecorder.stream.getTracks().forEach(track => track.stop());
        clearInterval(talqinInterval);
        
        document.getElementById('btn-start-talqin-' + idOnline).classList.remove('hidden');
        document.getElementById('btn-start-talqin-' + idOnline).innerHTML = '<i class="fas fa-redo"></i> Ulangi';
        document.getElementById('btn-stop-talqin-' + idOnline).classList.add('hidden');
        document.getElementById('indicator-talqin-' + idOnline).classList.add('hidden');
    }
};

window.hapusTalqinUstadz = function(idOnline) {
    talqinAudioChunks = [];
    talqinAudioBase64 = null;
    const preview = document.getElementById('audio-preview-talqin-' + idOnline);
    preview.src = "";
    preview.classList.add('hidden');
    document.getElementById('btn-hapus-talqin-' + idOnline).classList.add('hidden');
    document.getElementById('btn-start-talqin-' + idOnline).innerHTML = '<i class="fas fa-microphone"></i> Rekam';
};

window.submitNilaiOnline = async function(e, idOnline) {
    e.preventDefault();
    
    let ayatNextValue = document.getElementById('ayat-next-' + idOnline).value;
    let safeAyatNext = (ayatNextValue && ayatNextValue.trim() !== '') ? "'" + ayatNextValue.trim() : '-';

    Swal.fire({ title: 'Menyimpan & Mengunggah Talqin...', html: 'Mohon tunggu sebentar...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    let audioTalqinUrl = "-";
    
    // Cek apakah variabel rekaman talqin ustadz terisi
    if (typeof talqinAudioBase64 !== 'undefined' && talqinAudioBase64) {
        let audioPayload = {
            base64: talqinAudioBase64,
            namaFile: 'Talqin_Ustadz_' + new Date().getTime()
        };
        let resAudio = await window.apiCall('uploadAudioTalqin', audioPayload);
        if (resAudio && resAudio.success) {
            audioTalqinUrl = resAudio.url;
        }
    }

    const payload = {
        id_online: idOnline,
        predikat: document.getElementById('predikat-' + idOnline).value,
        feedback: document.getElementById('feedback-' + idOnline).value || '-',
        surah_next: document.getElementById('surah-next-' + idOnline).value,
        ayat_next: safeAyatNext,
        nama_ustadz: state.user.nama_lengkap,
        audio_talqin: audioTalqinUrl // Pastikan terkirim ke backend
    };
    
    const res = await window.apiCall('nilaiSetoranOnline', payload);
    if(res && res.success) {
        window.playSuccessSound();
        Swal.fire('Berhasil', res.message, 'success');
        
        // Bersihkan memori rekaman setelah sukses terkirim
        if (typeof talqinAudioBase64 !== 'undefined') {
            talqinAudioBase64 = null; 
        }
        
        window.loadDashboardData();
    } else {
        Swal.fire('Gagal', (res ? res.message : 'Terjadi kesalahan sistem'), 'error');
    }
};

window.updateRbSantri = function(kelas) {
  let sel = document.getElementById('rb-santri');
  if(!sel) return;
  let filtered = state.santri.filter(s => String(s.kelas || s.KELAS || '').trim().toLowerCase() === String(kelas).trim().toLowerCase());
  sel.innerHTML = '<option value="">-- Pilih Santri --</option>' + filtered.map(s => `<option value="${s.nama_santri || s.nama || s.NAMA_SANTRI}">${s.nama_santri || s.nama || s.NAMA_SANTRI}</option>`).join('');
};

window.updateRbBaris = function(el) {
  let opt = el.options[el.selectedIndex];
  if(!opt.value) return;
  document.getElementById('rb-no-surat').value = opt.getAttribute('data-no');
  document.getElementById('rb-nama-surat').value = opt.getAttribute('data-nama');
  let b = opt.getAttribute('data-baris');
  document.getElementById('rb-jumlah-baris').value = b;
  document.getElementById('rb-info-baris').textContent = b + " baris";
};

window.handleSimpanRaporBiru = async function(e) {
  e.preventDefault();
  const payload = {
    kelas: document.getElementById('rb-kelas').value,
    namaSantri: document.getElementById('rb-santri').value,
    noSurat: document.getElementById('rb-no-surat').value,
    namaSurat: document.getElementById('rb-nama-surat').value,
    jumlahBaris: document.getElementById('rb-jumlah-baris').value,
    salahHafalan: document.getElementById('rb-salah-hafalan').value,
    salahTajwid: document.getElementById('rb-salah-tajwid').value,
    salahMakhroj: document.getElementById('rb-salah-makhroj').value,
    namaUstadz: state.user ? state.user.nama_lengkap : '-',
    username: state.user ? state.user.username : '-' // <--- BARIS INI YANG DITAMBAHKAN
  };

  Swal.fire({ title: 'Menyimpan ke Rapor...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  const res = await window.apiCall('simpanRaporBiru', payload);
  if (res.success) {
    window.playSuccessSound();
    Swal.fire('Berhasil', res.message, 'success');
    document.getElementById('rb-salah-hafalan').value = 0;
    document.getElementById('rb-salah-tajwid').value = 0;
    document.getElementById('rb-salah-makhroj').value = 0;
    window.loadDashboardData(); 
  } else {
    Swal.fire('Gagal', res.message, 'error');
  }
};

window.handleKirimSetoranOnline = async function(e) {
  e.preventDefault();
  if (!audioBase64) {
      return Swal.fire('Peringatan', 'Harap rekam setoran terlebih dahulu sebelum mengirim!', 'warning');
  }
  
  Swal.fire({ title: 'Mengirim Setoran...', html: 'Mengunggah audio...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  
  const santriName = state.santri_info ? (state.santri_info.nama_santri || state.santri_info.NAMA_SANTRI) : state.user.nama_lengkap;
  const audioPayload = { base64: audioBase64, namaFile: 'Setoran_Onl_' + santriName.replace(/\s+/g, '_') + '_' + new Date().getTime() };
  
  const resAudio = await window.apiCall('uploadAudioTalqin', audioPayload);
  if (!resAudio.success) return Swal.fire('Gagal', 'Gagal mengunggah audio. Silakan coba lagi.', 'error');

  const payload = {
      tanggal: new Date().toISOString().split('T')[0],
      id_santri: state.user.id_santri || state.user.ID_Santri || '',
      nama_santri: santriName,
      surah: document.getElementById('onl-surah').value,
      ayat: "'" + document.getElementById('onl-ayat').value,
      catatan: document.getElementById('onl-catatan').value || '-',
      audio_url: resAudio.url
  };

  Swal.update({ html: 'Menyimpan laporan...' });
  const res = await window.apiCall('addSetoranOnline', payload);
  if (res.success) {
      window.playSuccessSound();
      Swal.fire('Berhasil', res.message, 'success');
      window.hapusRekaman();
      window.loadDashboardData();
  } else {
      Swal.fire('Gagal', res.message, 'error');
  }
};

window.openEditMutabaah = function(item) {
  document.getElementById('edit-mut-id').value = item.ID_Mutabaah || item.id_Mutabaah || item[0] || '';
  
  // Perbaiki pembacaan tanggal lokal di frontend
  let rawDate = item.tanggal || item.Tanggal || item.TANGGAL || '';
  if (rawDate) {
    let d = new Date(rawDate);
    if (!isNaN(d.getTime())) {
      // Paksa ambil tanggal lokal komputer/HP (WIB)
      let year = d.getFullYear();
      let month = String(d.getMonth() + 1).padStart(2, '0');
      let day = String(d.getDate()).padStart(2, '0');
      document.getElementById('edit-mut-tgl').value = `${year}-${month}-${day}`;
    } else {
      document.getElementById('edit-mut-tgl').value = String(rawDate).split('T')[0];
    }
  }

  document.getElementById('edit-mut-catatan').value = item.catatan || item.CATATAN || '';

  const fields = [
    'subuh', 'dzuhur', 'ashar', 'maghrib', 'isya',
    'merapikan_tempat_tidur', 'doa_bangun_tidur', 'mandi_pagi', 'sikat_gigi',
    'berpamitan', 'dzikir_pagi', 'dhuha', 'akhlak_adab', 'menghormati_tua',
    'menyayangi_muda', 'jaga_lisan', 'tidur_tepat_waktu',
    'murojaah_ashar', 'murojaah_maghrib', 'murojaah_isya'
  ];

  fields.forEach(f => {
    let el = document.getElementById('edit-mut-' + f);
    if (el) {
      el.checked = (item[f] === 'Ya');
    }
  });

  const modal = document.getElementById('modal-edit-mutabaah');
  if (modal) {
    modal.classList.add('active'); // atau modal.style.display = 'flex'; (sesuaikan dengan CSS Anda)
  }
};

// 2. FUNGSI UNTUK MENYIMPAN PERUBAHAN
window.handleUpdateMutabaah = async function(e) {
  e.preventDefault();

  const fields = [
    'subuh', 'dzuhur', 'ashar', 'maghrib', 'isya',
    'merapikan_tempat_tidur', 'doa_bangun_tidur', 'mandi_pagi', 'sikat_gigi',
    'berpamitan', 'dzikir_pagi', 'dhuha', 'akhlak_adab', 'menghormati_tua',
    'menyayangi_muda', 'jaga_lisan', 'tidur_tepat_waktu',
    'murojaah_ashar', 'murojaah_maghrib', 'murojaah_isya'
  ];

  let payload = {
    id_mutabaah: document.getElementById('edit-mut-id').value,
    
    // 🔥 KUNCI SOLUSINYA DI SINI: KITA TIDAK MEMASUKKAN TANGGAL KE DALAM PAYLOAD
    // Sehingga sistem backend tidak akan menyentuh/mengubah tanggal sama sekali di database!
    
    catatan: document.getElementById('edit-mut-catatan').value || '-'
  };

  fields.forEach(f => {
    let el = document.getElementById('edit-mut-' + f);
    payload[f] = el && el.checked ? 'Ya' : 'Tidak';
  });

  Swal.fire({ title: 'Menyimpan Perubahan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

  const res = await window.apiCall('updateMutabaah', payload);
  if (res.success) {
    window.playSuccessSound(); // Jika Anda pakai sound
    Swal.fire('Berhasil', res.message, 'success');
    window.closeModal('modal-edit-mutabaah');
    window.loadDashboardData(); // Muat ulang layar
  } else {
    Swal.fire('Gagal', res.message, 'error');
  }
};

window.searchAkunMurid = function(keyword) {
    const lowerKeyword = keyword.toLowerCase();
    const classCards = document.querySelectorAll('.class-group-card');
    
    classCards.forEach(classCard => {
        let hasVisibleStudent = false;
        const studentCards = classCard.querySelectorAll('.murid-login-card');
        
        studentCards.forEach(studentCard => {
            const nama = studentCard.getAttribute('data-nama');
            if (nama.includes(lowerKeyword)) {
                studentCard.style.display = '';
                hasVisibleStudent = true;
            } else {
                studentCard.style.display = 'none';
            }
        });
        
        if (hasVisibleStudent) {
            classCard.style.display = '';
        } else {
            classCard.style.display = 'none';
        }
    });
};

window.handleProgFilterKelas = function(val) { stateProgKelas = val; window.renderApp(); };

window.openProgressModal = function(id) {
  const s = state.santri.find(x => String(x.id_santri || x.ID_SANTRI) === String(id));
  if(!s) return;
  
  document.getElementById('prog-id').value = s.id_santri || s.ID_SANTRI;
  document.getElementById('prog-nama').innerHTML = "<i class='fas fa-user-circle text-gray-400 text-lg'></i> " + (s.nama_santri || s.nama || s.NAMA_SANTRI || 'Tanpa Nama');
  document.getElementById('prog-hafalan').value = (s.jumlah_hafalan || s.JUMLAH_HAFALAN || '-') === '-' ? '' : (s.jumlah_hafalan || s.JUMLAH_HAFALAN || '');
  document.getElementById('prog-murojaah').value = (s.murojaah || s.MUROJAAH || '-') === '-' ? '' : (s.murojaah || s.MUROJAAH || '');
  document.getElementById('prog-surah-pilihan').value = (s.juz_hafal || s.JUZ_HAFAL || '-') === '-' ? '' : (s.juz_hafal || s.JUZ_HAFAL || '');
  
  let rawValTarget = s.nilai_target || s.NILAI_TARGET || s.Nilai_Target || s['Nilai Target'] || s['NILAI TARGET'] || s.target || '-';
  document.getElementById('prog-nilai-target').value = rawValTarget === '-' ? '' : window.formatNilaiTargetClean(rawValTarget);
  
  const kelasSantri = String(s.kelas || s.KELAS || '-');
  document.getElementById('prog-kelas-otomatis').value = kelasSantri; 
  const kelasSantriClean = kelasSantri.trim().toLowerCase().replace(/\s+/g, ' ');
  
  const targetData = (state.target || []).find(t => { let tKelas = String(t.kelas || t.KELAS || '').trim().toLowerCase().replace(/\s+/g, ' '); return tKelas === kelasSantriClean || tKelas.includes(kelasSantriClean) || kelasSantriClean.includes(tKelas); });
  if (targetData) { let sAwal = targetData.surat_awal || targetData.SURAT_AWAL || targetData.surah_awal || '-'; let sAkhir = targetData.surat_akhir || targetData.SURAT_AKHIR || targetData.surah_akhir || '-'; document.getElementById('prog-info-target').value = `${sAwal} - ${sAkhir}`; } else { document.getElementById('prog-info-target').value = "Belum diset"; }
  if(document.getElementById('prog-surah-pilihan').value) window.hitungNilaiBom();
  window.openModal('modal-progress');
};

window.hitungNilaiBom = function() {
  const kelasSantri = String(document.getElementById('prog-kelas-otomatis').value).trim().toLowerCase().replace(/\s+/g, ' ');
  const surahPilihan = document.getElementById('prog-surah-pilihan').value;
  const targetData = (state.target || []).find(t => { let tKelas = String(t.kelas || t.KELAS || '').trim().toLowerCase().replace(/\s+/g, ' '); return tKelas === kelasSantri || tKelas.includes(kelasSantri) || kelasSantri.includes(tKelas); });
  const targetInput = document.getElementById('prog-nilai-target');
  
  if (!targetData) { 
      targetInput.value = "Target Belum Ada"; 
      targetInput.className = "w-full bg-gray-100 border border-gray-200 rounded-2xl p-4 text-xl font-bold text-gray-500 text-center shadow-inner"; 
      return; 
  }
  if (!surahPilihan) { 
      targetInput.value = ""; 
      targetInput.className = "w-full bg-gray-50 border border-gray-100 rounded-2xl p-4 text-2xl font-bold text-[#044343] text-center shadow-inner"; 
      return; 
  }

  let sAwal = targetData.surat_awal || targetData.SURAT_AWAL || targetData.surah_awal || '-'; 
  let sAkhir = targetData.surat_akhir || targetData.SURAT_AKHIR || targetData.surah_akhir || '-';
  const idxPilihan = DAFTAR_SURAH.indexOf(surahPilihan) + 1, idxAwal = DAFTAR_SURAH.indexOf(sAwal) + 1, idxAkhir = DAFTAR_SURAH.indexOf(sAkhir) + 1;
  
  if (idxAwal > 0 && idxAkhir > 0 && idxPilihan > 0) {
    const totalSurahTarget = Math.abs(idxAwal - idxAkhir) + 1; 
    const totalDicapai = Math.abs(idxAwal - idxPilihan) + 1;
    let persen = (totalDicapai / totalSurahTarget) * 100; 
    if (persen > 100) persen = 100;
    
    let roundedVal = Math.round(persen);
    targetInput.value = roundedVal + "%";
    
    if (roundedVal >= 100) {
        targetInput.className = "w-full bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-2xl font-bold text-emerald-600 text-center shadow-inner";
    } else if (roundedVal >= 90 && roundedVal < 100) {
        targetInput.className = "w-full bg-amber-50 border border-amber-200 rounded-2xl p-4 text-2xl font-bold text-amber-600 text-center shadow-inner";
    } else {
        targetInput.className = "w-full bg-red-50 border border-red-200 rounded-2xl p-4 text-2xl font-bold text-red-600 text-center shadow-inner";
    }
  } else { 
      targetInput.value = "Cek Ejaan"; 
  }
};

window.handleSelectKelasInput = function(kelasVal) { state.selectedInputKelas = kelasVal; window.populateSantriSelect(); };
window.populateSantriSelect = function() {
  const sel = document.getElementById('inp-santri'); if(!sel) return;
  let filteredSantri = state.santri;
  if (state.selectedInputKelas) filteredSantri = filteredSantri.filter(s => String(s.kelas || s.KELAS || '').trim().toLowerCase() === String(state.selectedInputKelas).trim().toLowerCase());
  if(filteredSantri.length === 0) sel.innerHTML = '<option value="">(Kosong)</option>';
  else sel.innerHTML = '<option value="">-- Pilih Murid --</option>' + filteredSantri.map(s => `<option value="${s.id_santri || s.ID_SANTRI}">${s.nama_santri || s.nama || s.NAMA_SANTRI || 'Tanpa Nama'}</option>`).join('');
};

window.openDetailGrup = function(tipe, namaGrup) {
    document.getElementById('detail-grup-title').innerText = (tipe === 'kelas' ? 'Kelas ' : 'Halaqah ') + namaGrup;
    
    let listMurid = (state.santri || []).filter(s => {
        let val = tipe === 'kelas' ? (s.kelas || s.KELAS) : (s.halaqah || s.HALAQAH);
        return String(val).trim() === String(namaGrup).trim();
    });
    
    document.getElementById('detail-grup-count').innerText = listMurid.length + ' Murid';
    
    let contentHtml = '';
    if (listMurid.length === 0) {
        contentHtml = `<div class="text-center p-8 bg-gray-50 rounded-2xl border border-dashed border-gray-200 text-gray-400 text-xs mt-4">Belum ada murid di ${tipe} ini.</div>`;

            let nama = s.nama_santri || s.nama || s.NAMA_SANTRI || s.Nama || 'Tanpa Nama';

            let uname = s.username || s.USERNAME || s.Username || s['Username'] || s['username'] || generatedUsername;
            let pass = s.password || s.PASSWORD || s.Password || s['Password'] || s['password'] || generatedPassword;
            
            return `

                        <div>
                            <p class="text-[9px] text-gray-500 font-bold uppercase tracking-wider mb-0.5">Password</p>
                            <p class="text-xs font-bold text-gray-800">${pass}</p>
                        </div>
                        <button onclick="window.copyCredential('${pass}')" class="w-8 h-8 rounded-lg bg-white border border-gray-200 text-gray-500 hover:text-[#044343] hover:border-[#044343] flex items-center justify-center transition-all shadow-sm" title="Salin Password">
                            <i class="far fa-copy text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>

        }).join('');
    }
    
    document.getElementById('detail-grup-content').innerHTML = contentHtml;
    window.openModal('modal-detail-grup');
};

window.renderRiwayatUstadz = function() {

          <span class="font-bold text-gray-800">${hariIniText} ${ayatClean && ayatClean !== '-' ? '('+ayatClean+')' : ''}</span>
        </div>
        ${akanDatangText ? `
        <div class="flex items-center justify-between text-xs bg-amber-50/50 px-3 py-2 rounded-xl border border-amber-100">
          <span class="font-bold text-amber-900"><i class="fa-solid fa-arrow-right text-amber-600 mr-1.5"></i> Tugas Selanjutnya:</span>
          <span class="font-bold text-gray-800">${akanDatangText}</span>

      detailHtml = `<p class="text-xs font-bold text-[#044343]">${s.tilawah}</p>`;
    } else if (!rawSurah.includes(' | Akan Datang: ') && (s.hadits && s.hadits !== '-')) {
      detailHtml = `<p class="text-xs font-bold text-[#044343]">${s.hadits}</p>`;
    }

    let namaSantriFinal = s.nama_santri || s.NAMA_SANTRI || s.nama || s.NAMA;
    if (!namaSantriFinal || namaSantriFinal === '-') { const stObj = state.santri.find(st => String(st.id_santri || st.ID_SANTRI) === String(s.id_santri || s.ID_SANTRI)); namaSantriFinal = stObj ? (stObj.nama_santri || stObj.NAMA_SANTRI || stObj.nama) : 'Tanpa Nama'; }
    let tglFormatted = s.tanggal ? new Date(s.tanggal).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : 'Hari Ini';

    return `
    <div class="bg-white p-4 rounded-3xl shadow-[0_4px_15px_rgba(0,0,0,0.03)] border border-gray-100 mb-4 relative hover:border-gray-200 transition-colors">
      <div class="absolute top-4 right-4 flex gap-1.5"><button onclick="window.openEditSetoran('${s.id_setoran || s.ID_SETORAN}')" class="w-7 h-7 bg-gray-50 hover:bg-gray-100 text-gray-500 rounded-full flex items-center justify-center transition-colors"><i class="fas fa-edit text-[10px]"></i></button><button onclick="window.confirmDeleteSetoran('${s.id_setoran || s.ID_SETORAN}')" class="w-7 h-7 bg-red-50 hover:bg-red-100 text-red-500 rounded-full flex items-center justify-center transition-colors"><i class="fas fa-trash text-[10px]"></i></button></div>

      <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-100">

  return `

      <div class="relative mb-5"><i class="fas fa-search absolute left-4 top-3.5 text-gray-400 text-sm"></i><input type="text" onkeyup="window.searchData('.bg-white.p-4.rounded-3xl', this.value)" placeholder="Cari Riwayat..." class="w-full bg-white border border-gray-100 rounded-2xl pl-10 pr-4 py-3 text-xs outline-none focus:border-[#044343] shadow-sm text-gray-700"></div>

  `;

window.switchInputType = function(type) { state.inputType = type; window.renderApp(); };

window.handleSubmitSetoran = async function(e) {
  e.preventDefault(); 
  const sel = document.getElementById('inp-santri');
  if(!sel || !sel.value) return Swal.fire('Peringatan', 'Pilih murid terlebih dahulu!', 'warning');
  
  let surahVal = '-', ayatVal = '-', surahNextVal = '-', ayatNextVal = '-', tilawahVal = '-', haditsVal = '-';
  if (state.inputType === 'hafalan') { 
    let sAwal = document.getElementById('inp-surah').value;
    let sAkhir = document.getElementById('inp-surah-akhir').value;
    surahVal = sAkhir ? `${sAwal} - ${sAkhir}` : sAwal;

    let rawAyatInp = document.getElementById('inp-ayat').value.trim();
    ayatVal = rawAyatInp ? "'" + rawAyatInp : '-';

    let sNextAwal = document.getElementById('inp-surah-next').value;
    let sNextAkhir = document.getElementById('inp-surah-next-akhir').value;
    surahNextVal = (sNextAwal && sNextAwal !== '-') ? (sNextAkhir ? `${sNextAwal} - ${sNextAkhir}` : sNextAwal) : '-';

    let rawAyatNextInp = document.getElementById('inp-ayat-next').value.trim();
    ayatNextVal = rawAyatNextInp ? "'" + rawAyatNextInp : '-';
    
    if (!sAwal || sAwal === '-') return Swal.fire('Peringatan', 'Silakan pilih Surah Hafalan Hari Ini!', 'warning'); 
  } 
  else if (state.inputType === 'tilawah') { tilawahVal = document.getElementById('inp-tilawah').value; }
  else if (state.inputType === 'hadits') { haditsVal = document.getElementById('inp-hadits').value; }

  let finalSurahText = surahVal;
  if (state.inputType === 'hafalan' && surahNextVal && surahNextVal !== '-') {
    let cleanAyatNext = ayatNextVal.replace(/^'/, '');
    let textNext = surahNextVal + (cleanAyatNext && cleanAyatNext !== '-' ? ` (${cleanAyatNext})` : '');
    finalSurahText = `${surahVal} | Akan Datang: ${textNext}`;
  }

  const santriName = sel.options[sel.selectedIndex].text.split(' (')[0];

  // Tampilkan loading awal
  Swal.fire({ title: 'Menyimpan Laporan...', html: 'Silakan tunggu...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

  // ALUR UPLOAD AUDIO TALQIN
  let audioUrlToSave = "-";
  if (audioBase64) {
      Swal.update({ html: 'Mengunggah rekaman suara...' });
      const audioPayload = {
          base64: audioBase64,
          namaFile: 'Talqin_' + santriName.replace(/\s+/g, '_') + '_' + new Date().getTime()
      };
      
      const resAudio = await window.apiCall('uploadAudioTalqin', audioPayload);
      if (resAudio.success) {
          audioUrlToSave = resAudio.url;
      } else {
          // Jika gagal unggah audio, tampilkan peringatan tapi tetap lanjutkan proses form
          Swal.fire('Peringatan', 'Upload audio gagal, menyimpan data tanpa audio.', 'warning');
      }
  }

  // ALUR SIMPAN DATA TEKS & LINK AUDIO
  const payload = { 
    tanggal: new Date().toISOString().split('T')[0], 
    id_santri: sel.value, 
    nama_santri: santriName, 
    surah: finalSurahText, 
    ayat: ayatVal, 
    surah_next: surahNextVal, 
    ayat_next: ayatNextVal,
    tilawah: tilawahVal, 
    hadits: haditsVal, 
    kualitas: document.getElementById('inp-kualitas').value, 
    catatan: document.getElementById('inp-catatan').value, 
    nama_ustadz: state.user.nama_lengkap,
    audio_talqin: audioUrlToSave // <- URL Audio disisipkan di sini
  };

  Swal.update({ html: 'Menyimpan riwayat setoran...' });
  const res = await window.apiCall('addSetoran', payload);
  
  if(res.success) { 
    window.playSuccessSound();
    Swal.fire('Berhasil', res.message, 'success'); 
    if(audioBase64) window.hapusRekaman(); // Reset form rekaman jika ada
    window.loadDashboardData(); 
  } else { 
    Swal.fire('Gagal', res.message, 'error'); 
  }
};

window.handleLogin = async function(e) {
  e.preventDefault(); const u = document.getElementById('username').value.trim(), p = document.getElementById('password').value.trim();
  const errorDiv = document.getElementById('login-error'), btn = document.getElementById('btn-login');
  if(errorDiv) errorDiv.classList.add('hidden');
  if(document.activeElement) document.activeElement.blur(); 
  if(btn) { btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-1"></i> Memeriksa...'; btn.disabled = true; }
  
  const res = await window.apiCall('login', {username: u, password: p});
  if (res.success) { 
    state.user = res.user; state.activeTab = 'beranda'; state.activeTabOrtu = 'beranda'; 
    window.renderApp(); window.loadDashboardData(); 
  } else { 
    if(btn) { btn.innerHTML = 'MASUK'; btn.disabled = false; } 
    if(errorDiv) { errorDiv.innerHTML = res.message || 'Gagal login'; errorDiv.classList.remove('hidden'); } 
  }
};

window.handleLogout = function() { state.user = null; location.reload(); };

window.loadDashboardData = async function() {  
  state.isLoading = true;  
  window.renderApp();  
  const role = String(state.user.role || '').trim().toLowerCase();
  const isUstadz = role === 'ustadz' || role === 'admin';  
  const targetIdSantri = state.user.id_santri || state.user.ID_Santri || state.user.ID_SANTRI || state.user.id_Santri || '';
  
  const res = await window.apiCall(isUstadz ? 'getDataUstadz' : 'getDataOrtu', isUstadz ? { user: state.user } : { id_santri: targetIdSantri });  
  
  if (res.success) state = { ...state, ...res };  

  try {
    const resKota = await fetch("https://api.myquran.com/v2/sholat/kota/cari/batam");
    const jsonKota = await resKota.json();
    if (jsonKota && jsonKota.data && jsonKota.data.length > 0) {
      const idBatam = jsonKota.data[0].id; 
      const todayStr = new Date().toISOString().split('T')[0];
      const resSalat = await fetch(`https://api.myquran.com/v2/sholat/jadwal/${idBatam}/${todayStr}`);
      const jsonSalat = await resSalat.json();
      if (jsonSalat && jsonSalat.status && jsonSalat.data && jsonSalat.data.jadwal) {
        const j = jsonSalat.data.jadwal;
        state.waktuSalat = { "Fajr": j.subuh, "Dhuhr": j.dzuhur, "Asr": j.ashar, "Maghrib": j.maghrib, "Isha": j.isya };
      }
    }
  } catch (err) { state.waktuSalat = { "Fajr": "04:47", "Dhuhr": "12:10", "Asr": "15:29", "Maghrib": "18:15", "Isha": "19:26" }; }

  state.isLoading = false;  
  window.renderApp();  
};

window.compressAndPreviewImage = function(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { const img = new Image(); img.onload = function() { const canvas = document.createElement('canvas'), MAX_SIZE = 150; let width = img.width, height = img.height; if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } } canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, width, height); ctx.drawImage(img, 0, 0, width, height); const base64String = canvas.toDataURL('image/jpeg', 0.6); document.getElementById('preview-logo').src = base64String; document.getElementById('inp-logo-base64').value = base64String; }; img.src = e.target.result; }; reader.readAsDataURL(file); };

          </div>

          <button type="button" onclick="window.prosesUploadExcel()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-xs shadow-md transition-all">Proses & Unggah Data</button>

window.downloadTemplateExcel = function(e) {
  e.preventDefault();
  let templateData = [
    { nama_santri: "Muhammad Arkan", nis: "2026001", kelas: "IV ALI BIN ABI THALIB", halaqah: "Ustadz Fadhl Al Harits", username_ortu: "arkan1", password_ortu: "sditds" },
    { nama_santri: "Fatimah Az-Zahra", nis: "2026002", kelas: "IV ALI BIN ABI THALIB", halaqah: "Ustadz Fadhl Al Harits", username_ortu: "fatimah2", password_ortu: "sditds" }
  ];
  let ws = XLSX.utils.json_to_sheet(templateData);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Format_Murid");
  XLSX.writeFile(wb, "Template_Import_Murid_SDITDS.xlsx");
};

window.prosesUploadExcel = function() {
  let fileInput = document.getElementById('file-excel-input');
  if (!fileInput.files || fileInput.files.length === 0) {
    return Swal.fire('Peringatan', 'Pilih file Excel terlebih dahulu!', 'warning');
  }

  let file = fileInput.files[0];
  let reader = new FileReader();

  Swal.fire({ title: 'Membaca File...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

  reader.onload = async function(e) {
    try {
      let data = new Uint8Array(e.target.result);
      let workbook = XLSX.read(data, { type: 'array' });
      let firstSheetName = workbook.SheetNames[0];
      let worksheet = workbook.Sheets[firstSheetName];
      let jsonRows = XLSX.utils.sheet_to_json(worksheet);

      if (jsonRows.length === 0) {
        return Swal.fire('Kosong', 'File Excel tidak memiliki data atau format salah.', 'error');
      }

      // Normalisasi nama kolom (mengubah spasi jadi underscore, huruf kecil semua)
      let formattedData = jsonRows.map(row => {
        let newRow = {};
        Object.keys(row).forEach(key => {
          let cleanKey = key.trim().toLowerCase().replace(/\s+/g, '_');
          newRow[cleanKey] = row[key];
        });
        return {
          nama_santri: newRow.nama_santri || newRow.nama || '',
          nis: newRow.nis || '-',
          kelas: newRow.kelas || '',
          halaqah: newRow.halaqah || '',
          username_ortu: String(newRow.username_ortu || newRow.username || '').trim().toLowerCase().split(' ').join(''),
          password_ortu: String(newRow.password_ortu || newRow.password || 'sditds').trim().toLowerCase().split(' ').join('')
        };
      }).filter(r => r.nama_santri && r.username_ortu);

      if (formattedData.length === 0) {
        return Swal.fire('Format Salah', 'Pastikan kolom "nama_santri" dan "username_ortu" terisi di dalam file Excel.', 'error');
      }

      Swal.update({ title: `Mengunggah ${formattedData.length} data murid...`, html: 'Mohon tunggu, sedang diproses ke server...' });

      let res = await window.apiCall('bulkAddSantri', formattedData);
      if (res.success) {
        document.getElementById('modal-upload-excel').remove();
        window.playSuccessSound();
        Swal.fire('Berhasil!', res.message, 'success');
        window.loadDashboardData();
      } else {
        Swal.fire('Gagal', res.message, 'error');
      }

    } catch (err) {
      Swal.fire('Error', 'Gagal membaca file Excel: ' + err.message, 'error');
    }
  };

  reader.readAsArrayBuffer(file);
};
